<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Windows Update</title>
<style>
body{background:#000;color:#fff;font-family:Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex-direction:column}
.dots{display:flex;gap:8px;margin-bottom:30px}
.dot{width:8px;height:8px;background:#0078d7;border-radius:50%;opacity:.6}
.percent{font-size:48px;margin:10px 0}
.text{font-size:22px;margin:5px 0}
.small{font-size:16px;color:#aaa}
</style>
</head>
<body>
<div class="dots">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>
<div class="percent">0%</div>
<div class="text">Working on updates</div>
<div class="small">Do not turn off your computer</div>
</body>
</html>
